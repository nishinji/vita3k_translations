# Sends the source strings to Crowdin and brings the translations back, every day.

name: Sync with Crowdin

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write

# Two runs would fight over the same branch.
concurrency:
  group: crowdin-sync
  cancel-in-progress: false

jobs:
  synchronize-with-crowdin:
    name: Sync with Crowdin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      # This repository -> Crowdin. A string Crowdin never received cannot be translated, so
      # the sources go up before anything is pulled back.
      - name: Upload the source strings to Crowdin
        uses: crowdin/github-action@v3
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
          push_translations: false
          create_pull_request: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      # Crowdin -> this repository, committed straight to main.
      - name: Download the translations from Crowdin
        uses: crowdin/github-action@v3
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          push_translations: true
          # Approval is barely used on this project, so a language is measured on what is translated.
          export_only_approved: false
          # Qt falls back to the source string on its own, and lrelease drops the rest anyway.
          skip_untranslated_strings: true
          localization_branch_name: main
          create_pull_request: false
          commit_message: 'Update translations from Crowdin'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  publish:
    name: Publish
    needs: synchronize-with-crowdin
    # A called workflow gets no more than this grants, and one asking for more fails to start.
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/generate-qm.yml
    secrets: inherit
