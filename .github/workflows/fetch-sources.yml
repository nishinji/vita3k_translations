# Brings the newest source strings over from the emulator repository.

name: Update the translation sources

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'

permissions:
  contents: write

jobs:
  update-sources:
    name: Update the translation sources
    runs-on: ubuntu-24.04

    env:
      SOURCE_REPO: ${{ vars.SOURCE_REPO || 'Vita3K/Vita3K' }}
      SOURCE_BRANCH: ${{ vars.SOURCE_BRANCH || 'master' }}
      GH_TOKEN: ${{ secrets.TEMPLATE_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find the run that published the Qt template
        id: source-run
        run: |
          if ! run_id=$(gh api "repos/$SOURCE_REPO/actions/workflows/qt-ts.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id'); then
            echo "Could not read qt-ts.yml in $SOURCE_REPO. A workflow that has never run is not"
            echo "registered there, so this also answers 404. Point the SOURCE_REPO variable at"
            echo "the repository that runs it, and run it there once."
            exit 1
          fi

          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "qt-ts.yml exists in $SOURCE_REPO but has no successful run to take a template from."
            exit 1
          fi
          echo "Using run $run_id of $SOURCE_REPO"
          echo "id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the Qt template
        uses: actions/download-artifact@v8
        with:
          name: Vita3K_Translation_Template
          path: template/
          repository: ${{ env.SOURCE_REPO }}
          run-id: ${{ steps.source-run.outputs.id }}
          github-token: ${{ env.GH_TOKEN }}

      # Android resources are plain files in the emulator repository, so unlike the Qt template
      # they need no build step. The download goes through a temporary file: a truncated one
      # committed here would empty the source file on Crowdin.
      - name: Download the Android strings
        run: |
          incoming="$RUNNER_TEMP/strings.xml"
          gh api "repos/$SOURCE_REPO/contents/android/app/src/main/res/values/strings.xml?ref=$SOURCE_BRANCH" \
            -H "Accept: application/vnd.github.raw" > "$incoming"
          python3 -c "import sys, xml.etree.ElementTree as ET; ET.parse(sys.argv[1])" "$incoming"
          mv "$incoming" android/strings.xml

      - name: Install the Qt linguist tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-l10n-tools

      # Crowdin only ever sees the template, so the languages have to carry the same message set.
      - name: Merge the template into every language
        run: |
          shopt -s nullglob
          lupdate=$(find /usr -name lupdate -type f | head -n 1)
          if [ -z "$lupdate" ]; then
            echo "lupdate not found."
            exit 1
          fi
          for ts_file in translations/*.ts; do
            "$lupdate" template/vita3k_template.ts -no-obsolete -ts "$ts_file"
          done

      - name: Commit the new strings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add template/vita3k_template.ts translations/ android/strings.xml

          if git diff --cached --quiet; then
            echo "The emulator repository brought no new strings."
            exit 0
          fi

          git commit -m "Update the sources and merge them into every language"
          git push
