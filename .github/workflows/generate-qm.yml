# Compiles the translations and publishes them as the release the emulator build downloads.

name: Publish the compiled translations

on:
  workflow_dispatch:
    inputs:
      review_all:
        description: 'Review every translated string instead of only what this import changed'
        type: boolean
        required: false
        default: false
  # The Crowdin sync pushes with GITHUB_TOKEN, which raises no push event, so it calls this
  # workflow directly instead of relying on the trigger below.
  workflow_call:
  push:
    branches:
      - main
    paths:
      - 'translations/*.ts'

permissions:
  contents: write
  # What the review flags is reported in an issue.
  issues: write

concurrency:
  group: publish-translations
  cancel-in-progress: false

jobs:
  generate-qm:
    name: Publish the compiled translations
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          # The review compares each language against HEAD~1 to find what this import changed.
          fetch-depth: 2

      - name: Install the Qt linguist tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-l10n-tools

      - name: Compile the translations
        run: |
          shopt -s nullglob
          mkdir -p qm
          lrelease=$(find /usr -name lrelease -type f | head -n 1)
          if [ -z "$lrelease" ]; then
            echo "lrelease not found."
            exit 1
          fi
          for ts_file in translations/*.ts; do
            "$lrelease" "$ts_file" -nounfinished -removeidentical -qm "qm/$(basename "$ts_file" .ts).qm"
          done

      # Crowdsourced strings reach users unread otherwise, so screen them for abuse and
      # obvious mistranslation. A review that cannot run must not hold up the release.
      - name: Review the incoming translations
        id: review
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REVIEW_ALL: ${{ inputs.review_all || 'false' }}
          REPORT_PATH: ${{ runner.temp }}/translation-review.md
        run: python3 scripts/review_translations.py

      - name: Commit the compiled translations
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The Android resources need no compiling and are committed by the sync, so a run that
          # only changed them leaves qm/ untouched and would otherwise publish nothing.
          changed=false
          if git show --name-only --format= HEAD -- android | grep -q .; then
            changed=true
          fi

          git add qm/
          if git diff --cached --quiet; then
            echo "No compiled translation changed."
          else
            git commit -m "Compile the translations"
            git push
            changed=true
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Upload the compiled translations
        uses: actions/upload-artifact@v7
        with:
          name: vita3k-qt-translations
          path: qm/
          compression-level: 1

      # A manual run is an explicit request for a release, which is how a change to the
      # packaging itself reaches one without waiting for the strings to move.
      - name: Publish the release
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          assets=()

          (cd qm && zip -r ../vita3k-qt-translations.zip .)
          assets+=(vita3k-qt-translations.zip)

          # Crowdin exports every language region qualified, which stops Android falling back
          # from de-AT to German at all, so the qualifiers are rewritten on the way in.
          values=(android/values-*)
          if [ ${#values[@]} -gt 0 ]; then
            python3 scripts/pack_android_strings.py --output vita3k-android-translations.zip
            assets+=(vita3k-android-translations.zip)
          fi

          date=$(date +'%Y-%m-%d')
          gh release create "translations-${date}-${{ github.run_number }}" "${assets[@]}" \
            --title "Translations $date" \
            --notes "Qt translations compiled from the .ts files, and the Android string resources, in this repository."

      # The run stays green whatever the review finds, so a flagged string would otherwise sit in a
      # run summary nobody opens. Every report goes to the one open issue until someone closes it.
      # This comes last so that failing to post cannot hold up the release, and it is left to fail
      # the run rather than lose the report quietly.
      - name: Report the review in an issue
        if: ${{ !cancelled() && (steps.review.outcome == 'failure' || steps.review.outputs.attention == 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_PATH: ${{ runner.temp }}/translation-review.md
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          comment="$RUNNER_TEMP/translation-review-comment.md"

          if [ "$REVIEW_OUTCOME" = "success" ]; then
            cp "$REPORT_PATH" "$comment"
          else
            # continue-on-error keeps a crashed review from holding up the release, and would
            # also keep anyone from hearing about it.
            printf '%s\n' "## Translation review" "" "> [!CAUTION]" \
              "> The review crashed before it could report, so this import shipped unscreened. The run log says why." \
              > "$comment"
          fi

          printf '\nFrom [%s #%s](%s/%s/actions/runs/%s).\n' "$GITHUB_WORKFLOW" "$GITHUB_RUN_NUMBER" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$comment"

          number=$(gh issue list --label translation-review --state open --limit 1 --json number --jq '.[0].number // empty')

          if [ -z "$number" ]; then
            gh label create translation-review --force --color d93f0b \
              --description "Strings the automated translation review flagged"

            body="$RUNNER_TEMP/translation-review-issue.md"
            cat > "$body" <<'EOF'
          Every import in which the automated review flags a string, or cannot review at all, adds a
          comment here. The strings have shipped by then: the review reports and does not block.

          Fix or reject them on [Crowdin](https://crowdin.com/project/vita3k), where the translations
          live; a change made in this repository is undone by the next sync. Close this issue once
          everything in it has been dealt with, and the next finding opens a new one.
          EOF

            url=$(gh issue create --label translation-review --title "Translation review" --body-file "$body")
            number=${url##*/}
          fi

          gh issue comment "$number" --body-file "$comment"
